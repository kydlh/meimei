<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 新年快乐 - 莓莓</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* --- 页面切换通用样式 --- */
        .full-page { display: none; width: 100%; height: 100vh; position: relative; }

        /* --- 页面1：信封 --- */
        #page1 { display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        .envelope-box { text-align: center; animation: floatUpDown 2s ease-in-out infinite; }
        @keyframes floatUpDown { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* --- 页面2：爱心动画 --- */
        #page2 { background: black; }
        .heart-mount { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 1px; height: 1px; animation: heartbeat 1.2s ease-in-out infinite; }
        @keyframes heartbeat { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.1); } }
        
        .tiny-heart { position: absolute; color: #ff85a2; text-shadow: 0 0 8px #ff1493; pointer-events: none; animation: burstAndFade 2s ease-out forwards; }
        @keyframes burstAndFade {
            0% { opacity: 0; transform: translate(0, 0) scale(0); }
            25% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1.2); }
            75% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }

        .center-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 100; }
        .name-text { 
            color: #ffb6c1; font-size: 50px; font-weight: bold; cursor: pointer; 
            letter-spacing: 10px; text-shadow: 0 0 20px #ff69b4; transition: 0.3s;
        }
        .name-text:hover { transform: scale(1.2); text-shadow: 0 0 30px #ff1493; }
        .blessing-text { color: white; font-size: 24px; pointer-events: none; margin-top: 10px; }

        /* --- 页面3：照片墙 (你的代码整合) --- */
        #page3 { background-color: #f3f4f5; overflow: hidden; }
        .page-wrap { margin: 10vh auto; display: flex; max-width: 1140px; }
        .container { width: 100%; height: 80vh; background: #f3f4f5; border-radius: 30px; overflow: hidden; position: relative;}
        .photo-container { position: relative; top: -90px; left: -120px; transform: rotate(10deg); }
        .photo-cont-item { display: flex; width: calc(380px * 12); }
        .photo-item { 
            width: 320px; height: 200px; margin-right: 60px; margin-bottom: 60px; 
            border-radius: 16px; background-size: cover; background-repeat: no-repeat; 
            background-position: center; box-shadow: 0px 2px 40px rgba(0, 0, 0, 0.15); 
        }

        .animation-1 { animation: scroller 40s linear infinite; }
        .animation-2 { margin-left: 150px; animation: scroller 30s linear infinite; }
        .animation-3 { animation: scroller 50s linear infinite; }

        @keyframes scroller {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-380px * 6)); }
        }

        /* 漂浮字 */
        .floating-text { position: absolute; white-space: nowrap; animation: floatUp linear infinite; pointer-events: none; z-index: 1; opacity: 0.5; }
        @keyframes floatUp { from { transform: translateY(110vh); } to { transform: translateY(-10vh); } }

        /* 图片资源 */
        .photo-1 { background-image: url(1.png); }
        .photo-2 { background-image: url(2.png); }
        .photo-3 { background-image: url(3.png); }
        .photo-4 { background-image: url(4.png); }
        .photo-5 { background-image: url(1.png); }
        .photo-6 { background-image: url(2.png); }
        .photo-7 { background-image: url(3.png); }
        .photo-8 { background-image: url(4.png); }
        .photo-9 { background-image: url(1.png); }
        .photo-10 { background-image: url(2.png); }
        .photo-11 { background-image: url(3.png); }
        .photo-12 { background-image: url(4.png); }
        .photo-13 { background-image: url(1.png); }
        .photo-14 { background-image: url(2.png); }
        .photo-15 { background-image: url(3.png); }
        .photo-16 { background-image: url(4.png); }
        .photo-17 { background-image: url(1.png); }
        .photo-18 { background-image: url(2.png); }
    </style>
</head>
<body>

    <div id="page1" class="full-page" style="display: flex;" onclick="goToPage2()">
        <div class="envelope-box">
            <div style="color:white; font-size:20px; margin-bottom:15px;">🎈 莓莓点开新年礼物 🎈</div>
            <div style="font-size: 80px;">✉️</div>
        </div>
    </div>

    <div id="page2" class="full-page">
        <div id="heart-container" class="heart-mount"></div>
        <div class="center-content">
            <div class="name-text" onclick="goToPage3()">莓莓</div>
            <div class="blessing-text">2026新年 快乐 🧨</div>
            <div style="color: #666; font-size: 12px; margin-top: 10px;">(点击名字查看回忆)</div>
        </div>
    </div>

    <div id="page3" class="full-page">
        <div class="page-wrap">
            <div class="container">
                <div class="photo-container">
                    <div class="photo-cont-item animation-1">
                        <div class="photo-item photo-1"></div><div class="photo-item photo-2"></div><div class="photo-item photo-3"></div>
                        <div class="photo-item photo-4"></div><div class="photo-item photo-5"></div><div class="photo-item photo-6"></div>
                        <div class="photo-item photo-1"></div><div class="photo-item photo-2"></div><div class="photo-item photo-3"></div>
                        <div class="photo-item photo-4"></div><div class="photo-item photo-5"></div><div class="photo-item photo-6"></div>
                    </div>
                    <div class="photo-cont-item animation-2">
                        <div class="photo-item photo-7"></div><div class="photo-item photo-8"></div><div class="photo-item photo-9"></div>
                        <div class="photo-item photo-10"></div><div class="photo-item photo-11"></div><div class="photo-item photo-12"></div>
                        <div class="photo-item photo-7"></div><div class="photo-item photo-8"></div><div class="photo-item photo-9"></div>
                        <div class="photo-item photo-10"></div><div class="photo-item photo-11"></div><div class="photo-item photo-12"></div>
                    </div>
                    <div class="photo-cont-item animation-3">
                        <div class="photo-item photo-13"></div><div class="photo-item photo-14"></div><div class="photo-item photo-15"></div>
                        <div class="photo-item photo-16"></div><div class="photo-item photo-17"></div><div class="photo-item photo-18"></div>
                        <div class="photo-item photo-13"></div><div class="photo-item photo-14"></div><div class="photo-item photo-15"></div>
                        <div class="photo-item photo-16"></div><div class="photo-item photo-17"></div><div class="photo-item photo-18"></div>
                    </div>
                </div>
            </div>
        </div>
        <button onclick="goToPage2()" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:10px 20px; border-radius:20px; border:none; background:#ffb6c1; cursor:pointer;">返回</button>
    </div>

    <script>
        let heartTimer;

        function goToPage2() {
            hideAll();
            document.getElementById('page2').style.display = 'block';
            heartTimer = setInterval(createHeartWave, 300);
            initFloatingWords();
        }

        function goToPage3() {
            hideAll();
            clearInterval(heartTimer); // 停止爱心生成以节省性能
            document.getElementById('page3').style.display = 'block';
            document.body.style.backgroundColor = "#fff"; // 页面3是白底
        }

        function hideAll() {
            document.querySelectorAll('.full-page').forEach(p => p.style.display = 'none');
            document.body.style.backgroundColor = "black";
        }

        function createHeartWave() {
            const container = document.getElementById('heart-container');
            if(!container) return;
            const count = 30; const scale = 18;
            for (let i = 0; i < count; i++) {
                const step = (i / count) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(step), 3);
                const y = -(13 * Math.cos(step) - 5 * Math.cos(2 * step) - 2 * Math.cos(3 * step) - Math.cos(4 * step));
                const span = document.createElement('span');
                span.className = 'tiny-heart'; span.innerText = '❤';
                span.style.setProperty('--tx', `${x * scale}px`);
                span.style.setProperty('--ty', `${y * scale}px`);
                span.style.fontSize = `${Math.random() * 10 + 10}px`;
                container.appendChild(span);
                setTimeout(() => span.remove(), 2000);
            }
        }

        function initFloatingWords() {
            const words = ["新年胜旧年 ❤️", "莓莓万事如意", "2026大吉", "HAPPY NEW YEAR"];
            const container = document.getElementById('page2');
            setInterval(() => {
                if(document.getElementById('page2').style.display === 'none') return;
                const el = document.createElement('div');
                el.className = 'floating-text';
                el.innerText = words[Math.floor(Math.random() * words.length)];
                el.style.left = Math.random() * 95 + 'vw';
                el.style.color = `hsl(${Math.random() * 40 + 330}, 80%, 80%)`;
                const dur = Math.random() * 5 + 5 + 's';
                el.style.animationDuration = dur;
                container.appendChild(el);
                setTimeout(() => el.remove(), parseFloat(dur) * 1000);
            }, 600);
        }
    </script>
</body>
</html>
